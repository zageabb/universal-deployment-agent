<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UDA users</title><link rel="stylesheet" href="{{ url_for('static',filename='home.css') }}"></head><body><main class="auth-shell" style="max-width:900px"><section class="auth-card"><p class="eyebrow">UDA ADMINISTRATION</p><h1>User access</h1><p><a href="{{ url_for('index') }}">Back to applications</a></p>{% for user in users %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="email" value="{{ user.email }}"><h2>{{ user.email }}{% if user.is_admin %} · Administrator{% endif %}</h2><label><input style="width:auto" type="checkbox" name="verified" value="1" {% if user.verified %}checked{% endif %}> Verified</label><fieldset><legend>Allowed UDA groups</legend>{% set selected=user.groups_json|from_json %}{% for group in groups %}<label><input style="width:auto" type="checkbox" name="groups" value="{{ group }}" {% if group in selected %}checked{% endif %}> {{ group }}</label>{% endfor %}</fieldset><button type="submit">Save access</button></form><hr>{% endfor %}</section></main></body></html>
