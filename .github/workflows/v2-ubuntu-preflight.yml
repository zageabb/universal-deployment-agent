name: V2-003 Ubuntu Preflight and Recovery

on:
  push:
    branches: [feature/uda-v2-ubuntu-preflight]
  pull_request:
    branches: [feature/uda-v2-multiservice-coordinator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - name: Read-only systemd, journal and rollback regression
        run: python -m pytest -q tests/test_onboarding_v2_ubuntu_preflight.py tests/test_onboarding_v2_recovery_journal.py tests/test_onboarding_v2_multiservice.py tests/test_onboarding_v2.py tests/test_onboarding_transaction.py tests/test_onboarding_adapter.py
      - name: Compile safe worker modules
        run: python -m py_compile onboarding_v2_ubuntu_preflight.py onboarding_v2_recovery_journal.py onboarding_v2_multiservice.py
