name: V2-003 Real Systemd Parser Acceptance
on:
  push:
    branches: [feature/uda-v2-systemd-verify]
  pull_request:
    branches: [feature/uda-v2-worker-rehearsal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  systemd-parse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - name: Require Ubuntu systemd-analyze parser
        run: test -x /usr/bin/systemd-analyze && /usr/bin/systemd-analyze --version
      - name: Real systemd syntax + all previous worker safety tests
        run: python -m pytest -q tests/test_onboarding_v2_systemd_verify.py tests/test_onboarding_v2_worker_rehearsal.py tests/test_onboarding_v2_runtime_profiles.py tests/test_onboarding_v2_approval.py tests/test_onboarding_v2_unit_renderer.py tests/test_onboarding_v2_unit_sandbox.py tests/test_onboarding_v2_ubuntu_preflight.py tests/test_onboarding_v2_recovery_journal.py tests/test_onboarding_v2_multiservice.py tests/test_onboarding_v2.py tests/test_onboarding_transaction.py tests/test_onboarding_adapter.py
      - name: Compile restricted parser
        run: python -m py_compile onboarding_v2_systemd_verify.py
