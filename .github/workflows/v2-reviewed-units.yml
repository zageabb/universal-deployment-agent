name: V2-003 Reviewed Unit Plans
on:
  push:
    branches: [feature/uda-v2-reviewed-unit-plans]
  pull_request:
    branches: [feature/uda-v2-unit-adapter]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-unit-plans:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - name: Unit renderer and previous V2 compatibility/security suites
        run: python -m pytest -q tests/test_onboarding_v2_unit_renderer.py tests/test_onboarding_v2_unit_sandbox.py tests/test_onboarding_v2_ubuntu_preflight.py tests/test_onboarding_v2_recovery_journal.py tests/test_onboarding_v2_multiservice.py tests/test_onboarding_v2.py tests/test_onboarding_transaction.py tests/test_onboarding_adapter.py
      - run: python -m py_compile onboarding_v2_unit_renderer.py
