name: V2 Full Stack Integration Regression
on:
  push:
    branches: [feature/uda-v2-systemd-crash-acceptance]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    name: Complete pytest Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned compatibility ranges and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Run all UDA legacy + V2 unit and crash-recovery regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q --junitxml=uda-v2-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uda-v2-stack-pytest-${{ matrix.python-version }}
          path: uda-v2-integration.xml
          retention-days: 7
