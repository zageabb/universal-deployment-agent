name: UDA Controlled Installer Regression
on:
  push:
    branches: [feature/uda-install-journal, feature/uda-runtime-integrity, feature/uda-controlled-installer]
  pull_request:
    branches: [feature/uda-runtime-integrity, feature/uda-controlled-installer, feature/uda-v2-process-crash-recovery]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest
      - run: sh -n install.sh
      - run: python -m pytest -q
