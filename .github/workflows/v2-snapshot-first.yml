name: V2-003 Snapshot Before Mutation
on:
  push:
    branches: [feature/uda-v2-snapshot-before-mutation]
  pull_request:
    branches: [feature/uda-v2-recovery-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - name: Snapshot-first integration and prior V2 safety tests
        run: python -m pytest -q tests/test_onboarding_v2_worker_rehearsal.py tests/test_onboarding_v2_recovery_preflight.py tests/test_onboarding_v2_systemd_verify.py tests/test_onboarding_v2_runtime_profiles.py tests/test_onboarding_v2_approval.py tests/test_onboarding_v2_unit_renderer.py tests/test_onboarding_v2_unit_sandbox.py tests/test_onboarding_v2_ubuntu_preflight.py tests/test_onboarding_v2_recovery_journal.py tests/test_onboarding_v2_multiservice.py tests/test_onboarding_v2.py tests/test_onboarding_transaction.py tests/test_onboarding_adapter.py
      - name: Compile modified transaction modules
        run: python -m py_compile onboarding_v2_worker_rehearsal.py onboarding_v2_multiservice.py onboarding_v2_recovery_journal.py
