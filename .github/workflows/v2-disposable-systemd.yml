name: V2-003 Disposable Ubuntu Systemd Lifecycle
on:
  push:
    branches: [feature/uda-v2-disposable-systemd-lifecycle]
  pull_request:
    branches: [feature/uda-v2-systemd-verify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-systemd-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable Ubuntu 24.04 systemd image
        run: docker build -t uda-v2-disposable:${{ github.sha }} tests/integration/v2_systemd
      - name: Start isolated systemd PID1 container (no host mounts or network)
        run: |
          docker run -d --name uda-v2-disposable-systemd \
            --privileged --cgroupns=private \
            --network none --read-only=false \
            --tmpfs /run --tmpfs /run/lock \
            uda-v2-disposable:${{ github.sha }}
          for i in $(seq 1 60); do
            if docker exec uda-v2-disposable-systemd systemctl list-units --no-pager >/dev/null 2>&1; then
              echo "Disposable systemd is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs uda-v2-disposable-systemd
          exit 1
      - name: Copy reviewed test fixtures into disposable container
        run: |
          docker cp tests/integration/v2_systemd/. uda-v2-disposable-systemd:/opt/uda-v2-disposable/
      - name: Exercise real services, health, failed upgrade and rollback
        run: |
          docker exec --env UDA_V2_DISPOSABLE_CONTAINER=1 uda-v2-disposable-systemd \
            python3 /opt/uda-v2-disposable/lifecycle_acceptance.py
      - name: Save acceptance evidence
        if: always()
        run: |
          mkdir -p /tmp/uda-v2-evidence
          docker cp uda-v2-disposable-systemd:/tmp/uda-v2-systemd-evidence.json /tmp/uda-v2-evidence/lifecycle.json || true
          docker logs uda-v2-disposable-systemd > /tmp/uda-v2-evidence/container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uda-v2-disposable-systemd-evidence
          path: /tmp/uda-v2-evidence/
          retention-days: 7
      - name: Remove disposable container
        if: always()
        run: docker rm -f uda-v2-disposable-systemd || true
